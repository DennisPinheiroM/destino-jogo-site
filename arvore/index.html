<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Destino — árvore de narrativas</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime&family=Patrick+Hand+SC&family=Caveat:wght@600&family=Inter:wght@400;600&display=swap">
<style>:root { --fundo: #141414; --papel: #1d1d1d; --linha: #333; --texto: #e6e3dc; --apagado: #9a968e; --verm: #c41a1a; --verm2: #ff5a4a; --ouro: #d9b45a; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--fundo); color: var(--texto); font: 15px/1.55 Inter, system-ui, sans-serif; }
a { color: inherit; }
button, .botao { font: inherit; background: #262626; color: var(--texto); border: 1px solid #444; border-radius: 6px; padding: 6px 10px; cursor: pointer; text-decoration: none; display: inline-block; }
button:hover, .botao:hover { border-color: #777; }
button[aria-pressed="true"] { background: var(--verm); border-color: var(--verm); color: #fff; }
button.mini, .mini { font-size: 12px; padding: 2px 6px; color: var(--apagado); }
.perigo { color: var(--verm2); }

.topo { position: sticky; top: 0; z-index: 5; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; padding: 10px 16px; background: #0d0d0d; border-bottom: 1px solid var(--linha); }
.marca { font: 26px/1 "Patrick Hand SC", cursive; letter-spacing: .08em; color: var(--verm2); }
.marca small { display: block; font: 11px Inter, sans-serif; letter-spacing: .1em; color: var(--apagado); text-transform: uppercase; }
#versoes { display: flex; gap: 6px; flex-wrap: wrap; }
#versoes button { font-size: 13px; }
.buscar { position: relative; margin-left: auto; }
#busca { width: 280px; max-width: 70vw; background: #1f1f1f; color: var(--texto); border: 1px solid #444; border-radius: 6px; padding: 7px 10px; font: inherit; }
#resultados { position: absolute; right: 0; top: 100%; width: 380px; max-width: 90vw; margin: 4px 0 0; padding: 4px; list-style: none; background: #1f1f1f; border: 1px solid #444; border-radius: 6px; }
#resultados a { display: block; padding: 5px 8px; text-decoration: none; border-radius: 4px; }
#resultados a:hover { background: #2c2c2c; }

.corpo { display: grid; grid-template-columns: 380px 1fr; min-height: calc(100vh - 60px); }
#lado { border-right: 1px solid var(--linha); background: #171717; position: sticky; top: 60px; height: calc(100vh - 60px); overflow: auto; }
#abas { display: flex; gap: 6px; padding: 10px 14px; border-bottom: 1px solid var(--linha); position: sticky; top: 0; background: #171717; z-index: 1; }
#painel { padding: 4px 16px 40px; }
#painel h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .12em; color: var(--apagado); margin: 22px 0 8px; }
.tese { font-size: 14px; color: #cfcbc2; }
.aviso { font-size: 13px; color: var(--ouro); border-left: 3px solid var(--ouro); padding-left: 10px; }
.lista { list-style: none; margin: 0; padding: 0; }
.lista li { padding: 7px 0; border-bottom: 1px solid #262626; }
.lista small { display: block; color: var(--apagado); font-size: 12.5px; margin-top: 2px; }
.legenda { font-size: 12.5px; color: var(--apagado); padding-left: 18px; }
.ferr { display: flex; gap: 6px; flex-wrap: wrap; }
a.ref { text-decoration: none; border-bottom: 1px dotted #666; }
a.ref b, .trilha a, .num { font-family: "Courier Prime", monospace; }
a.ref b { color: var(--verm2); font-weight: 400; }
.quebrado { color: var(--verm2); text-decoration: line-through; }

.arvore ul { list-style: none; margin: 0; padding-left: 14px; border-left: 1px dashed #333; }
.arvore ul.raiz { padding-left: 0; border: 0; }
.arvore li { margin: 1px 0; }
.arvore summary { cursor: pointer; list-style: none; }
.arvore summary::-webkit-details-marker { display: none; }
.arvore summary::before { content: '▸'; color: #666; display: inline-block; width: 12px; }
.arvore details[open] > summary::before { content: '▾'; }
.arvore a, .arvore .folha span { display: inline-block; padding: 2px 5px; border-radius: 4px; text-decoration: none; font-size: 13.5px; }
.arvore .folha { padding-left: 12px; }
.arvore a:hover { background: #262626; }
.arvore a.atual { background: var(--verm); color: #fff; }
.arvore b { font: 12px "Courier Prime", monospace; color: var(--apagado); margin-right: 3px; }
.arvore a.atual b { color: #fff; }
.arvore .vazio span { color: #777; }
.arvore .go a { color: var(--apagado); }

.selo { font-size: 12px; margin-left: 3px; }
.f-morte, .selo.f-morte { color: var(--verm2); }
.f-final, .selo.f-final { color: var(--ouro); }
.f-recomeco, .selo.f-recomeco { color: #8fb6e0; }
.selo.mem { color: #b48ae0; }
.selo.go, .selo.vazio { color: #777; }

main { min-width: 0; }
.barra { display: flex; gap: 8px; padding: 10px 28px 0; }
.so-editavel { display: none; }
body.editavel .so-editavel { display: inline-block; }
#leitura { max-width: 820px; padding: 8px 28px 80px; }
.trilha { font-size: 12.5px; color: var(--apagado); display: flex; flex-wrap: wrap; align-items: center; gap: 4px; margin: 8px 0 16px; }
.trilha a { text-decoration: none; background: #222; padding: 1px 6px; border-radius: 4px; }
.trilha a.aqui { background: var(--verm); color: #fff; }
.trilha .esc { font-style: italic; }
.trilha .sep { color: #555; }
.refgrande { font: 15px "Courier Prime", monospace; color: var(--apagado); display: flex; gap: 10px; align-items: center; }
.refgrande b { color: var(--verm2); font-size: 22px; }
.cab h1 { font: 400 40px/1.1 "Patrick Hand SC", cursive; margin: 4px 0 6px; letter-spacing: .02em; }
.meta { display: flex; gap: 8px; flex-wrap: wrap; font-size: 12px; }
.k { padding: 1px 7px; border-radius: 10px; border: 1px solid; font-size: 11.5px; }
.k-des { color: #e6e3dc; border-color: #888; }
.k-jogo { color: #8fd18f; border-color: #4d7a4d; }
.k-rev { color: var(--ouro); border-color: #7a6431; }
.k-novo { color: var(--verm2); border-color: #7a2a24; }
.bat, .idt { color: var(--apagado); }

.quadros { list-style: none; counter-reset: q; padding: 0; margin: 22px 0; }
.quadros li { counter-increment: q; position: relative; padding: 10px 14px 10px 46px; margin: 6px 0; background: var(--papel); border-radius: 6px; border-left: 3px solid #333; }
.quadros li::before { content: counter(q); position: absolute; left: 12px; top: 11px; font: 12px "Courier Prime", monospace; color: #666; }
.quem { display: block; font-size: 10.5px; text-transform: uppercase; letter-spacing: .12em; color: var(--apagado); margin-bottom: 3px; }
.q-ver .quem { display: none; }
.q-bilhete .fala, .q-datilo .fala, .q-alto .fala { display: inline-block; background: #e9e6df; color: #151515; padding: 10px 16px; transform: rotate(-.6deg); box-shadow: 2px 3px 0 #000; }
.q-bilhete .fala { font: 22px/1.25 Caveat, cursive; }
.q-datilo .fala { font: 15px/1.5 "Courier Prime", monospace; }
.q-alto .fala { font: 22px/1.15 "Patrick Hand SC", cursive; letter-spacing: .03em; transform: rotate(1.4deg); }
.q-vermelha { border-left-color: var(--verm); background: #120808; }
.q-vermelha .fala { font: 17px/1.35 "Patrick Hand SC", cursive; color: var(--verm2); letter-spacing: .05em; }
.q-maquina .fala { font: 16px "Courier Prime", monospace; color: #fff; }
.q-som .fala { font: 24px Caveat, cursive; color: #bbb; }
.q-nota { background: transparent; border: 1px dashed #444; }
.q-nota .fala { color: var(--apagado); font-style: italic; font-size: 13.5px; }
.q-voz { border-left-color: #8fb6e0; }
.q-voz .fala { font-size: 16px; }
.v-bordado .fala { font: 22px Caveat, cursive; color: var(--verm2); }
.v-conta .fala { font: italic 15px "Courier Prime", monospace; color: #aaa; }
.v-tinta .fala { font: 24px/1.1 "Patrick Hand SC", cursive; color: var(--verm2); }
.v-luz .fala { font: 22px/1.1 "Patrick Hand SC", cursive; color: #fff; text-shadow: 0 0 12px #fff8; }
.v-eu .fala { font-style: italic; }
.v-eu { border-left-color: #ccc; }

.ganho { color: #c8a8ef; font-size: 14px; }
.ganho.obj { color: #ccc; }
.fim { margin: 20px 0; padding: 14px 18px; border: 1px solid; border-radius: 8px; }
.fim span { font-size: 12px; text-transform: uppercase; letter-spacing: .14em; display: block; }
.fim b { font: 400 28px "Patrick Hand SC", cursive; }
.fim p { margin: 4px 0 10px; color: #cfcbc2; }
.fim.f-final { background: #1d1a10; }
.fim.f-morte { background: #1c0d0c; }
.segue { margin: 18px 0; padding: 10px 14px; background: #1b1b1b; border-radius: 6px; }

.escolha { margin: 26px 0; }
.pergunta { font: 30px "Patrick Hand SC", cursive; text-align: center; margin-bottom: 8px; }
.escolha ol { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.opt { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; padding: 12px 14px; background: #e9e6df; color: #151515; border-radius: 4px; text-decoration: none; transition: transform .1s; }
a.opt:hover { transform: translateX(3px); box-shadow: -4px 0 0 var(--verm); }
.opt .num { grid-row: span 4; font-size: 14px; color: var(--verm); align-self: center; min-width: 54px; }
.opt .lbl { font: 26px/1.1 Caveat, cursive; }
.opt .dest, .opt .voto, .opt .cond { font-size: 12.5px; color: #555; }
.opt .cond { color: #7a3fb0; }
.opt.go { background: #cfccc5; }
.opt.travada { background: #2a2a2a; color: #777; }
.opt.travada .lbl { text-decoration: line-through; }
.opt.travada .num { color: #777; }
.chegam { font-size: 13px; color: var(--apagado); }
.chegam a { text-decoration: none; }
.copiar { margin-top: 30px; }

.ed label { display: block; margin: 10px 0; font-size: 13px; color: var(--apagado); }
.ed input, .ed select, .ed textarea { display: block; width: 100%; margin-top: 3px; background: #1f1f1f; color: var(--texto); border: 1px solid #444; border-radius: 5px; padding: 7px 9px; font: 14px/1.45 Inter, sans-serif; }
.ed textarea { font-family: "Courier Prime", monospace; }
.ed .linha { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.ed fieldset { border: 1px solid #333; border-radius: 6px; margin: 14px 0; }
.ed legend { color: var(--verm2); font-size: 13px; padding: 0 6px; }
.dica { font-size: 12px; color: var(--apagado); }
.dica code { color: var(--texto); }
.ed-ops { list-style: none; padding: 0; }
.ed-ops li { display: grid; grid-template-columns: 54px 1fr 200px auto; gap: 6px; align-items: center; padding: 8px 0; border-bottom: 1px solid #2a2a2a; }
.ed-ops input { margin: 0; }
.ed-ops .num { color: var(--verm2); font-size: 13px; }
.ed-ops .dest { grid-column: 2 / -1; font-size: 13px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.ed-ops .dest select { width: auto; max-width: 420px; display: inline-block; }
.acoes { display: flex; gap: 3px; }
.acoes button { padding: 3px 7px; }

.so-celular { display: none; }
@media (max-width: 900px) {
  html, body { font-size: 16px; }
  .so-celular { display: inline-block; }
  .topo { position: static; gap: 8px 10px; padding: 8px 10px; }
  #menu { font-size: 20px; padding: 4px 12px; min-height: 40px; }
  .marca { font-size: 22px; }
  #versoes { order: 3; width: 100%; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  #versoes::-webkit-scrollbar { display: none; }
  #versoes button { flex: none; padding: 8px 12px; }
  .buscar { order: 4; margin-left: 0; width: 100%; }
  #busca { width: 100%; max-width: none; font-size: 16px; padding: 9px 10px; }
  #resultados { width: 100%; max-width: none; max-height: 60vh; overflow: auto; z-index: 6; }
  #resultados a { padding: 10px; }
  .corpo { grid-template-columns: 1fr; min-height: 0; }
  #lado { display: none; position: fixed; inset: 0; height: auto; z-index: 7; border: 0; }
  body.lado-aberto { overflow: hidden; }
  body.lado-aberto #lado { display: block; }
  #abas button { flex: 1; padding: 9px; }
  #abas #fechar { flex: none; font-size: 18px; padding: 6px 14px; }
  .barra #menu2 { margin-left: auto; }
  .arvore a, .arvore .folha span { padding: 6px 6px; font-size: 15px; }
  .arvore summary::before { width: 16px; }
  .lista li { padding: 10px 0; }
  .barra { position: sticky; top: 0; z-index: 3; background: var(--fundo); padding: 8px 12px; border-bottom: 1px solid #222; }
  .barra button { padding: 8px 14px; }
  #leitura { padding: 4px 12px 80px; }
  .trilha { flex-wrap: nowrap; overflow-x: auto; white-space: nowrap; padding-bottom: 4px; }
  .trilha a { padding: 4px 8px; }
  .cab h1 { font-size: 30px; }
  .quadros li { padding: 10px 12px 10px 34px; }
  .quadros li::before { left: 9px; }
  .q-bilhete .fala, .q-datilo .fala, .q-alto .fala { display: block; padding: 10px 12px; }
  .pergunta { font-size: 26px; }
  .opt { padding: 12px; gap: 2px 10px; }
  .opt .num { min-width: 0; font-size: 13px; }
  .opt .lbl { font-size: 24px; }
  a.opt:hover { transform: none; box-shadow: none; }
  a.opt:active { box-shadow: -4px 0 0 var(--verm); }
  .ed input, .ed select, .ed textarea { font-size: 16px; }
  .ed .linha { grid-template-columns: 1fr; }
  .ed fieldset { padding: 6px 8px; margin: 12px 0; }
  .ed-ops li { grid-template-columns: 34px 1fr; }
  .ed-ops .curto, .acoes { grid-column: 2; }
  .ed-ops .dest select { max-width: 100%; width: 100%; }
  .acoes button { padding: 7px 12px; }
  .ferr button, .copiar button, .ferr .botao { padding: 8px 12px; }
}
</style>
</head>
<body>
<header class="topo">
  <button id="menu" class="so-celular" aria-label="mostrar o painel">☰</button>
  <div class="marca">DESTINO <small>árvore de narrativas</small></div>
  <nav id="versoes" aria-label="versões"></nav>
  <div class="buscar"><input id="busca" placeholder="ir para… (ex.: 2.2.1 ou um título)" autocomplete="off"><ul id="resultados" hidden></ul></div>
</header>
<div class="corpo">
  <aside id="lado">
    <nav id="abas"><button data-p="resumo">Resumo</button><button data-p="arvore">Árvore</button><button id="fechar" class="so-celular" aria-label="fechar o painel">✕</button></nav>
    <div id="painel"></div>
  </aside>
  <main>
    <div class="barra"><button id="voltar">← voltar</button><button id="menu2" class="so-celular">☰ painel</button><button id="editar" class="so-editavel" aria-pressed="false">✎ Editar</button></div>
    <article id="leitura"></article>
  </main>
</div>
<script>/* ============================================================
   DESTINO — árvore de narrativas: o tronco comum às três versões.
   O caminho desenhado (Ciclo I) e o que já está no jogo 3D são
   iguais em todas; cada versão preenche os galhos (V.<gancho>).

   Formato de um nó:
     { id, t: título, k: 'des'|'jogo'|'rev'|'novo', bat, cena: [quadros],
       q: pergunta, ops: [opção], go: 'id' (segue sem escolha),
       mem: [memórias ganhas], obj: [objetos do ciclo], fim: {t, n, d} }
   Opção: { l: texto, p: votação original, n: nó filho | go: 'id',
            req: memória exigida, c: condição em texto }
   Quadros: texto simples = o que se vê; prefixos:
     B: bilhete do autor · D: bilhete datilografado · A: bilhete do ser alto
     F: fala vermelha · M: máquina de escrever · S: som desenhado
     N: nota de design · @voz: canal próprio da versão (ver "vozes")
   Em bilhetes e falas, " / " quebra a linha.
   ============================================================ */
'use strict';
const VERSOES = [];
const SER_ALTO_Q = 'O SER QUE TE DIRECIONOU PARA A TOCA VERMELHA';

/* escolhas que se repetem quando um galho volta ao caminho */
const escolhaQuem = () => [
  { l: 'Recentemente acordei em um corredor', go: 'corredor' },
  { l: 'Também não lembro quem sou', go: 'naoLembro' },
];
const escolhaCorredor = () => [
  { l: 'Ligar a lanterna', go: 'ligar' },
  { l: 'Fugir no escuro', go: 'fugir' },
];
const escolhaSerAlto = () => [
  { l: 'Pedir ajuda', go: 'ajuda' },
  { l: 'Passar correndo', go: 'passar' },
  { l: 'Dar meia volta', go: 'meiaVolta' },
];
const escolhaToca = () => [
  { l: 'Quem é você?', go: 'quem' },
  { l: 'Onde eu estou?', go: 'onde' },
  { l: 'Como eu saio daqui?', go: 'como' },
  { l: 'Por que você não suporta a luz?', go: 'porque' },
];

function tronco(V) {
  const nota = (id, nd) => { if (V.notas && V.notas[id]) nd.cena = nd.cena.concat([].concat(V.notas[id]).map(s => 'N: ' + s)); return nd; };
  const no = (id, nd) => nota(id, Object.assign({ id }, nd));
  /* galho que a versão escreve; na árvore editável (V.base) fica vazio, esperando ser escrito */
  const gancho = (id, nd) => { if (!nd) { if (V.base) return null; throw new Error('versão sem o galho ' + id); } nd.id = nd.id || id; return nd; };

  /* trechos do jogo que a versão pode reescrever: ganham o id e as notas do original */
  ['cima', 'meio', 'baixo', 'espelhoCobrir', 'espelhoPortal', 'recolhedor'].forEach(k => {
    if (V[k]) { V[k].id = V[k].id || k; nota(k, V[k]); }
  });

  const deitar = no('deitar', { t: 'Deitar na cama', k: 'jogo', cena: [
    'Ela deita na forma do colchão.',
    'S: Toc Toc',
    'Silêncio.',
    'A porta se abre devagar. Dedos longos na borda.',
    'O sono vem antes de quem bate.',
  ], fim: { t: 'recomeco', n: 'O sono', d: 'Acorda no corredor, sem susto. Novo ciclo.' } });

  const elevador = no('elevador', { t: 'A porta nova: o elevador', k: 'jogo', cena: [
    'A chave serve. Uma antessala.',
    'Um elevador de grade.',
    'Três botões sem número. O de baixo tem um dedo vermelho.',
  ], q: '?', ops: [
    { l: 'Botão de cima', p: 34, n: V.cima || no('cima', { t: 'Botão de cima: o arquivo', k: 'jogo', cena: [
      'Um arquivo: estantes até o escuro, pacotes de papel amarrados com fio vermelho.',
      'Na máquina de escrever, um papel.',
      'D: VOCÊ NÃO DEVIA / TER SUBIDO / SEM LUZ.',
      'As luzes apagam, uma a uma, até a cabine.',
      'Ela corre. A grade bate.',
    ], go: 'elevador' }) },
    { l: 'Botão do meio', p: 28, n: V.meio || no('meio', { t: 'Botão do meio: o quarto', k: 'jogo', cena: [
      'O quarto de alguém. A cama ainda tem a forma de quem dormia. Um copo d\'água. Um relógio parado.',
      'No travesseiro:',
      'B: NÃO DEITE. / EU DEITEI UMA VEZ / E ACORDEI / NO CORREDOR.',
      'S: Toc Toc',
    ], q: '?', ops: [
      { l: 'Deitar na cama', p: 45, n: deitar },
      { l: 'Voltar ao elevador', p: 55, go: 'elevador' },
    ] }) },
    { l: 'Botão de baixo', p: 38, n: V.baixo || no('baixo', { t: 'Botão de baixo: o andar inundado', k: 'jogo', cena: [
      'Andar inundado. Velas vermelhas boiando. Um vulto de costas.',
      'A cabine sobe sem ela.',
      'Uma vela apaga. Ele está mais perto.',
      'Outra.',
      'A última.',
      'O rosto. O bote.',
    ], fim: { t: 'morte', n: 'As velas', d: 'Recomeço.' } }) },
  ] });

  const espelhos = no('espelhos', { t: 'A porta trancada: os espelhos', k: 'jogo', cena: [
    'A chave serve.',
    'Uma sala de espelhos cobertos por lençóis.',
    'O do fundo está descoberto. O reflexo mostra a sala, mas não ela.',
  ], q: '?', ops: [
    { l: 'Cobrir o espelho', p: 52, n: V.espelhoCobrir || no('espelhoCobrir', { t: 'Cobrir o espelho', k: 'jogo', cena: [
      'Ela cobre o espelho com o lençol.',
      'S: FLAP',
      'Outro lençol cai, de outro espelho.',
      'Nele, a outra: pele de cera, cabelo escuro, sorriso.',
      'Ela sai do espelho.',
    ], fim: { t: 'morte', n: 'A outra', d: 'Recomeço.' } }) },
    { l: 'Continuar olhando', p: 48, n: V.espelhoPortal || no('espelhoPortal', { t: 'Continuar olhando', k: 'jogo', cena: [
      'O reflexo apaga. Duas luzes.',
      'O espelho cede.',
      'O avesso da parede dos buracos. O braço de garras espera junto ao "?".',
      'Ele recua.',
      'A luz do "?" a devolve à sala branca.',
    ], go: 'abrir1' }) },

/* ============================================================
   DESTINO — árvore de narrativas: leitura, navegação e edição.
   Referência de um trecho = números das opções escolhidas desde o
   início (ex.: 2.2.1 = Direita → Seguir o vermelho → Olhar para trás).
   ============================================================ */
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const KIND = { des: 'desenhado', jogo: 'no jogo', rev: 'revisado', novo: 'novo' };
const FIM = { morte: ['morte', '☠'], recomeco: ['recomeço', '↺'], final: ['final', '★'] };
const CHAVE_MINHA = 'destino.minhaArvore.v1', CHAVE_CLIP = 'destino.galhoCopiado.v1';

/* ---------------- dados ---------------- */
const clone = o => JSON.parse(JSON.stringify(o));
function prepara(ver) {
  ver.porId = {}; ver.porRef = {}; ver.chegam = {}; ver.lista = [];
  let auto = 0;
  const usados = new Set();
  (function walk(nd, ref, pai, op) {
    if (!nd.id || usados.has(nd.id)) nd.id = (nd.id ? nd.id + '_' : 'n') + (auto++);
    usados.add(nd.id);
    Object.assign(nd, { ref, pai, via: op });
    ver.porId[nd.id] = nd; ver.porRef[ref] = nd; ver.lista.push(nd);
    (nd.ops || []).forEach((o, k) => { if (o.n) walk(o.n, ref ? ref + '.' + (k + 1) : String(k + 1), nd, o); });
  })(ver.raiz, '', null, null);
  ver.lista.forEach(nd => {
    const marca = (alvo, rot) => { (ver.chegam[alvo] = ver.chegam[alvo] || []).push({ de: nd, rot }); };
    if (nd.go) marca(nd.go, 'segue');
    (nd.ops || []).forEach(o => { if (o.go) marca(o.go, o.l); });
  });
}
/* conserta para salvar: tira campos calculados (pai, ref…) */
function limpo(nd) {
  const o = {};
  ['id', 't', 'k', 'bat', 'cena', 'q', 'go', 'mem', 'obj', 'fim'].forEach(k => { if (nd[k] != null && nd[k] !== '' && !(Array.isArray(nd[k]) && !nd[k].length)) o[k] = clone(nd[k]); });
  if (nd.ops) o.ops = nd.ops.map(op => {
    const r = {}; ['l', 'p', 'req', 'c', 'go'].forEach(k => { if (op[k] != null && op[k] !== '') r[k] = op[k]; });
    if (op.n) r.n = limpo(op.n); return r;
  });
  return o;
}

const VERS = {};
VERSOES.forEach(v => { v.raiz = tronco(v.h); v.chave = String(v.n); prepara(v); VERS[v.chave] = v; });
const MINHA = { chave: 'm', n: 'm', nome: 'Minha árvore', editavel: true };
function baseDoJogo() { return limpo(tronco({ base: true })); }
function carregaMinha() {
  let r = null;
  try { r = JSON.parse(localStorage.getItem(CHAVE_MINHA) || 'null'); } catch (e) { }
  MINHA.raiz = r && r.cena ? r : baseDoJogo();
  prepara(MINHA);
}
function salvaMinha() {
  try { localStorage.setItem(CHAVE_MINHA, JSON.stringify(limpo(MINHA.raiz))); } catch (e) { }
  prepara(MINHA);
  $('#salvo').textContent = 'salvo ' + new Date().toLocaleTimeString().slice(0, 5);
}
carregaMinha();
VERS.m = MINHA;

/* ---------------- estado ---------------- */
const S = { v: '1', ref: '', editar: false, painel: 'resumo' };
function ver() { return VERS[S.v]; }
function atual() { return ver().porRef[S.ref] || ver().raiz; }
function rotRef(nd) { return nd.ref === '' ? 'início' : nd.ref; }
function vaiPara(v, ref) { location.hash = '#' + v + '/' + (ref || '0'); }
function vaiId(id) { const nd = ver().porId[id]; if (nd) vaiPara(S.v, nd.ref); }
function leHash() {
  const m = location.hash.match(/^#([1-9]|m)\/?([\d.]*)/);
  if (m && VERS[m[1]]) { S.v = m[1]; S.ref = m[2] === '0' ? '' : (m[2] || ''); }
  if (!ver().porRef[S.ref]) S.ref = '';
  desenha();
}

/* ---------------- texto ---------------- */
function linkId(id, v = ver()) {
  const nd = v.porId[id];
  if (!nd) return `<span class="quebrado" title="trecho não encontrado">${esc(id)}?</span>`;
  return `<a class="ref" href="#${v.chave}/${nd.ref || '0'}"><b>${esc(rotRef(nd))}</b> ${esc(nd.t)}</a>`;
}
const comLinks = s => esc(s).replace(/\[\[(\w+)\]\]/g, (_, id) => linkId(id));
function quadro(s, v) {
  const m = String(s).match(/^(@\w+|[BDAFMSN]):\s?([\s\S]*)$/);
  if (!m) return `<li class="q-ver">${esc(s)}</li>`;
  const [, tipo, txt] = m;
  const linhas = esc(txt).split(' / ').join('<br>');
  if (tipo[0] === '@') {
    const nome = tipo.slice(1), rot = (v.vozes && v.vozes[nome]) || nome;
    return `<li class="q-voz v-${esc(nome)}"><span class="quem">${esc(rot)}</span><span class="fala">${linhas}</span></li>`;
  }
  const cls = { B: 'bilhete', D: 'datilo', A: 'alto', F: 'vermelha', M: 'maquina', S: 'som', N: 'nota' }[tipo];
  const rot = { B: 'bilhete', D: 'datilografado', A: 'bilhete do ser alto', F: 'fala no escuro', M: 'máquina de escrever', S: 'som', N: 'nota de design' }[tipo];
  return `<li class="q-${cls}"><span class="quem">${rot}</span><span class="fala">${linhas}</span></li>`;
}
function selos(nd) {
  let s = '';
  if (nd.fim) s += `<span class="selo f-${nd.fim.t}" title="${FIM[nd.fim.t][0]}">${FIM[nd.fim.t][1]}</span>`;
  if (nd.mem && nd.mem.length) s += '<span class="selo mem" title="ganha memória">◆</span>';
  if (nd.go) s += '<span class="selo go" title="volta a outro trecho">↪</span>';
  if (!nd.fim && !nd.go && !(nd.ops && nd.ops.length)) s += '<span class="selo vazio" title="sem continuação">…</span>';
  return s;
}

/* ---------------- desenho ---------------- */
function desenha() {
  document.querySelectorAll('#versoes button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === S.v));
  document.body.classList.toggle('editavel', !!ver().editavel);
  document.body.classList.toggle('editando', !!ver().editavel && S.editar);

}

function desenhaLado() {
  const v = ver();
  document.querySelectorAll('#abas button').forEach(b => b.setAttribute('aria-pressed', b.dataset.p === S.painel));
  const box = $('#painel');

  let h = '';
  if (v.editavel) {
    h += `<p class="tese">Sua árvore começa com o que já está no jogo. Os caminhos travados aparecem vazios: abra um trecho, ligue o modo <b>Editar</b> e escreva o que acontece, crie escolhas novas ou finais. Tudo fica salvo neste navegador; use <b>Exportar</b> para guardar um arquivo.</p>
    <div class="ferr"><button id="exportar">Exportar</button><label class="botao">Importar<input type="file" id="importar" accept=".json,application/json" hidden></label><button id="restaurar">Restaurar a base do jogo</button></div>
    <p class="mini" id="salvo"></p>`;

  h += `<h3>Finais (${finais.length})</h3><ul class="lista">` + finais.map(n => `<li>${linkId(n.id)}<small>${esc(n.fim.d || '')}</small></li>`).join('') + '</ul>';

  const mems = {};
  v.lista.forEach(n => (n.mem || []).forEach(m => (mems[m] = mems[m] || { ganha: [], abre: [] }).ganha.push(n)));
  v.lista.forEach(n => (n.ops || []).forEach(o => { if (o.req) (mems[o.req] = mems[o.req] || { ganha: [], abre: [] }).abre.push(n); }));
  const nm = Object.keys(mems);
  if (nm.length) h += '<h3>Memórias e condições</h3><ul class="lista">' + nm.map(m => `<li><b>◆ ${esc(m)}</b><small>${esc((v.memorias || {})[m] || '')}</small>
    <small>ganha em: ${mems[m].ganha.map(n => linkId(n.id)).join(' · ') || '—'}</small><small>abre em: ${mems[m].abre.map(n => linkId(n.id)).join(' · ') || '—'}</small></li>`).join('') + '</ul>';
  if (v.criaturas) h += '<h3>Criaturas e personagens</h3><ul class="lista">' + v.criaturas.map(c => `<li><b>${esc(c.nome)}</b><small>${comLinks(c.d)}</small></li>`).join('') + '</ul>';
  h += `<h3>Legenda</h3><ul class="legenda"><li><span class="k k-des">desenhado</span> do quadrinho original</li><li><span class="k k-jogo">no jogo</span> já existe no 3D</li><li><span class="k k-rev">revisado</span> existe no jogo, alterado aqui</li><li><span class="k k-novo">novo</span> proposta</li>
    <li>☠ morte (recomeço) · ↺ recomeço sem morte · ★ final · ◆ memória · ↪ volta a outro trecho</li></ul>`;
  box.innerHTML = h;
  if (v.editavel) ligaFerramentas();
}

function ramo(nd, v) {
  const at = atual(), aberto = at.ref === nd.ref || at.ref.startsWith(nd.ref ? nd.ref + '.' : '') || nd.ref === '';
  const filhos = (nd.ops || []).map((o, k) => {
    const r = nd.ref ? nd.ref + '.' + (k + 1) : String(k + 1);
    if (o.n) return ramo(o.n, v);
    if (o.go) { const alvo = v.porId[o.go]; return `<li class="folha go"><a href="#${v.chave}/${alvo ? alvo.ref || '0' : '0'}"><b>${r}</b> ${esc(o.l)} <span class="selo go">↪ ${alvo ? esc(rotRef(alvo)) : esc(o.go) + '?'}</span></a></li>`; }
    return `<li class="folha vazio"><span><b>${r}</b> ${esc(o.l)} <i>— ainda não escrito</i></span></li>`;
  }).join('');
  const rot = `<a href="#${v.chave}/${nd.ref || '0'}" class="${at === nd ? 'atual' : ''}"><b>${esc(rotRef(nd))}</b> ${esc(nd.via ? nd.via.l : nd.t)} ${selos(nd)}</a>`;
  if (!filhos) return `<li class="folha">${rot}</li>`;
  const corpo = `<details ${aberto ? 'open' : ''}><summary>${rot}</summary><ul>${filhos}</ul></details>`;
  return nd.ref === '' ? `<ul class="raiz"><li>${corpo}</li></ul>` : `<li>${corpo}</li>`;
}

  if (nd.obj && nd.obj.length) h += `<p class="ganho obj">Leva consigo: <b>${nd.obj.map(esc).join(', ')}</b></p>`;
  if (nd.fim) h += `<div class="fim f-${nd.fim.t}"><span>${FIM[nd.fim.t][1]} ${FIM[nd.fim.t][0]}</span><b>${esc(nd.fim.n || '')}</b><p>${esc(nd.fim.d || '')}</p>

      if (o.go) { const alvo = v.porId[o.go]; return `<li><a class="opt go" href="#${v.chave}/${alvo ? alvo.ref || '0' : ''}"><span class="num">${r}</span><span class="lbl">${esc(o.l)}</span>${cond}${voto}<span class="dest">↪ volta para ${alvo ? `<b>${esc(rotRef(alvo))}</b> ${esc(alvo.t)}` : esc(o.go) + ' (não encontrado)'}</span></a></li>`; }

  $('#leitura').scrollTop = 0; window.scrollTo(0, 0);
}
function copiaTexto(t, b) { (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => { b.textContent = 'copiado'; }, () => { prompt('Referência:', t); }); }

/* ---------------- edição (minha árvore) ---------------- */

    if (o.n) dest = `<a href="#m/${r}" class="botao">abrir ${r}</a> <button data-a="rmGalho" data-k="${k}" class="perigo">apagar o galho</button>`;
    else if (o.go) dest = `↪ <select data-a="goOp" data-k="${k}">${opcoesDestino(o.go)}</select> <button data-a="desliga" data-k="${k}">desligar</button>`;
    else dest = `<button data-a="novo" data-k="${k}">Escrever este caminho</button> <button data-a="liga" data-k="${k}">Voltar a um trecho existente</button>${clip ? ` <button data-a="cola" data-k="${k}">Colar galho (${esc(JSON.parse(clip).de)})</button>` : ''}`;
    return `<li><span class="num">${r}</span><input data-f="l" data-k="${k}" value="${esc(o.l)}" placeholder="texto da opção">
      <input data-f="req" data-k="${k}" value="${esc(o.req)}" placeholder="requer memória (opcional)" class="curto">
      <span class="acoes"><button data-a="sobe" data-k="${k}" title="subir">↑</button><button data-a="desce" data-k="${k}" title="descer">↓</button><button data-a="rmOp" data-k="${k}" class="perigo" title="remover a opção">✕</button></span>
      <div class="dest">${dest}</div></li>`;
  }).join('') + `</ol><button data-a="addOp">+ Adicionar escolha</button></fieldset></form>`;
  return h;
}
function ligaEditor(nd) {
  const f = $('.ed');
  const lista = s => s.split(',').map(x => x.trim()).filter(Boolean);
  const grava = () => {
    nd.t = f.t.value; nd.k = f.k.value; nd.bat = f.bat.value || undefined;
    nd.cena = f.cena.value.split('\n').map(s => s.trim()).filter(Boolean);
    nd.mem = lista(f.mem.value); nd.obj = lista(f.obj.value);
    nd.fim = f.fimT.value ? { t: f.fimT.value, n: f.fimN.value, d: f.fimD.value } : undefined;
    nd.go = f.go.value || undefined; nd.q = f.q.value || undefined;
    f.querySelectorAll('[data-f]').forEach(i => { nd.ops[+i.dataset.k][i.dataset.f] = i.value || undefined; });
    salvaMinha(); desenhaLado();
  };
  f.addEventListener('change', grava);
  f.addEventListener('click', e => {
    const b = e.target.closest('button[data-a]'); if (!b) return;
    grava();
    const k = +b.dataset.k, ops = nd.ops = nd.ops || [];
    const a = b.dataset.a;
    if (a === 'addOp') ops.push({ l: 'Nova escolha' });
    if (a === 'rmOp' || a === 'rmGalho') {
      if (b.dataset.certo !== '1') { b.dataset.certo = '1'; b.textContent = 'tem certeza?'; return; }
      if (a === 'rmOp') ops.splice(k, 1); else delete ops[k].n;
    }
    if (a === 'sobe' && k > 0) [ops[k - 1], ops[k]] = [ops[k], ops[k - 1]];
    if (a === 'desce' && k < ops.length - 1) [ops[k + 1], ops[k]] = [ops[k], ops[k + 1]];
    if (a === 'novo') ops[k].n = { id: 'm' + Date.now().toString(36), t: ops[k].l, k: 'novo', cena: [] };
    if (a === 'liga') ops[k].go = MINHA.raiz.id;
    if (a === 'desliga') delete ops[k].go;
    if (a === 'cola') {
      const c = JSON.parse(localStorage.getItem(CHAVE_CLIP)).no, ex = new Set(MINHA.lista.map(n => n.id));
      (function renomeia(n) { while (ex.has(n.id)) n.id += '_'; ex.add(n.id); (n.ops || []).forEach(o => o.n && renomeia(o.n)); })(c);
      ops[k].n = c;
    }
    salvaMinha(); desenha();
  });
  f.addEventListener('change', e => { const s = e.target.closest('select[data-a="goOp"]'); if (s) { nd.ops[+s.dataset.k].go = s.value || undefined; salvaMinha(); desenha(); } });
}
function ligaFerramentas() {
  $('#exportar').onclick = () => {
    const blob = new Blob([JSON.stringify(limpo(MINHA.raiz), null, 1)], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'destino-minha-arvore.json'; a.click();
  };
  $('#importar').onchange = e => {
    const fl = e.target.files[0]; if (!fl) return;
    fl.text().then(t => { const r = JSON.parse(t); if (!r.cena && !r.ops) throw 0; MINHA.raiz = r; salvaMinha(); vaiPara('m', ''); desenha(); })
      .catch(() => { $('#salvo').textContent = 'arquivo inválido'; });
  };
  $('#restaurar').onclick = e => {
    const b = e.currentTarget;
    if (b.dataset.certo !== '1') { b.dataset.certo = '1'; b.textContent = 'Apagar tudo e restaurar? (clique de novo)'; return; }
    MINHA.raiz = baseDoJogo(); salvaMinha(); vaiPara('m', ''); desenha();
  };
}

/* ---------------- busca e controles ---------------- */
$('#versoes').innerHTML = VERSOES.map(v => `<button data-v="${v.chave}" title="${esc(v.nome)}"><b>V${v.n}</b> ${esc(v.nome)}</button>`).join('') + '<button data-v="m"><b>✎</b> Minha árvore</button>';
$('#versoes').onclick = e => { const b = e.target.closest('button'); if (b) vaiPara(b.dataset.v, ''); };
$('#abas').onclick = e => { const b = e.target.closest('button'); if (b && b.dataset.p) { S.painel = b.dataset.p; desenhaLado(); } };
$('#editar').onclick = () => { S.editar = !S.editar; $('#editar').setAttribute('aria-pressed', S.editar); desenha(); };
$('#voltar').onclick = () => history.back();
const lado = aberto => document.body.classList.toggle('lado-aberto', aberto);
$('#menu').onclick = $('#menu2').onclick = () => lado(true);
$('#fechar').onclick = () => lado(false);
const busca = $('#busca'), res = $('#resultados');
busca.oninput = () => {
  const q = busca.value.trim().toLowerCase(); if (!q) { res.hidden = true; return; }
  const ref = q.replace(/^v?\d\s*[:·]\s*/, '');
  const achados = ver().lista.filter(n => n.ref === ref || (n.ref + ' ' + n.t + ' ' + (n.via ? n.via.l : '')).toLowerCase().includes(q)).slice(0, 10);
  res.innerHTML = achados.map(n => `<li><a href="#${ver().chave}/${n.ref || '0'}"><b>${esc(rotRef(n))}</b> ${esc(n.t)}</a></li>`).join('') || '<li><i>nada encontrado</i></li>';
  res.hidden = false;
};
busca.onkeydown = e => { if (e.key === 'Enter') { const a = res.querySelector('a'); if (a) { location.hash = a.getAttribute('href'); busca.value = ''; res.hidden = true; } } };
document.addEventListener('click', e => { if (!e.target.closest('.buscar')) res.hidden = true; if (e.target.closest('#painel a') && innerWidth <= 900) lado(false); });
addEventListener('hashchange', leHash);
leHash();
