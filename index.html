<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Destino</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Courier+Prime&family=Patrick+Hand+SC&display=swap">
<style>
  :root { color-scheme: dark; --red: #a80000; --ink: #120000; }
  html, body { height: 100%; margin: 0; }
  body { background: radial-gradient(120% 80% at 50% 40%, #b80202 0%, #8f0000 70%, #6a0000 100%); color: var(--ink);
    display: grid; place-items: center; text-align: center; padding: 24px 16px; box-sizing: border-box; }
  main { display: grid; gap: 18px; justify-items: center; max-width: 420px; }
  h1 { margin: 0; font: 400 clamp(64px, 20vw, 120px)/.9 "Patrick Hand SC", cursive; letter-spacing: .06em; }
  p { margin: 0; font: 15px/1.5 "Courier Prime", monospace; opacity: .85; }
  nav { display: grid; gap: 14px; margin-top: 10px; width: 100%; }
  a { display: block; padding: 14px 18px; border: 2.5px solid var(--ink); border-radius: 46% 54% 50% 48% / 60% 44% 56% 40%;
      color: var(--ink); text-decoration: none; font: 700 30px/1.1 Caveat, cursive; }
  a small { display: block; font: 15px "Courier Prime", monospace; opacity: .8; margin-top: 4px; }
  a:hover, a:focus-visible { background: rgba(0,0,0,.12); outline: none; }
</style>
</head>
<body>
<main>
  <h1>DESTINO</h1>
  <p>Um corredor, uma escolha, depois outra. Os caminhos que a maioria escolheu já foram desenhados.</p>
  <nav>
    <a href="2d/">versão desenhada<small>quadros em nanquim e carvão</small></a>
    <a href="3d/">versão em 3D<small>primeira pessoa, câmera contínua</small></a>
  </nav>
</main>
</body>
</html>
